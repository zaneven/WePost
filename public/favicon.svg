<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="48%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="wp-card" x1="6.5" y1="7" x2="21.5" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="32" height="32" rx="8" fill="url(#wp-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- 后置倾斜卡片（代表卡组连载与层叠排版） -->
  <rect x="9.5" y="5.5" width="13.5" height="18" rx="2.5" transform="rotate(8 9.5 5.5)" fill="white" fill-opacity="0.32"/>
  
  <!-- 前置主卡片（3:4 比例社交媒体卡片） -->
  <rect x="6.5" y="7" width="15" height="19.5" rx="3" fill="url(#wp-card)"/>
  
  <!-- 卡片排版元数据标志（类别标签与原点） -->
  <rect x="9.5" y="9.5" width="4.5" height="1.5" rx="0.75" fill="#0D9488"/>
  <circle cx="16.5" cy="10.25" r="0.75" fill="#94A3B8"/>
  <circle cx="18.5" cy="10.25" r="0.75" fill="#CBD5E1"/>
  
  <!-- 核心 W 符印（极速识别的现代双 V 折线） -->
  <path d="M9.5 13.5L12 21.5L14 16.5L16 21.5L18.5 13.5" stroke="#0F172A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
